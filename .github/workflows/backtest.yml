name: Backtest Weekly

on:
  schedule:
    - cron: '0 8 * * 0'   # domenica alle 9:00 CET (8 UTC)
  workflow_dispatch:       # run manuale da GitHub UI

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/the_machine.db
          key: the-machine-db-${{ github.run_id }}
          restore-keys: the-machine-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py --mode backtest
