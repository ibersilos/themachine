name: Weekly Signal Scan

on:
  schedule:
    - cron: '0 6 * * 1'   # ogni lunedì alle 7:00 CET (6 UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/the_machine.db
          key: the-machine-db-${{ github.run_id }}
          restore-keys: the-machine-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EDGAR_USER_AGENT:   ${{ secrets.EDGAR_USER_AGENT }}
        run: python run_once.py --mode signals
