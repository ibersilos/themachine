name: Signal Scan

on:
  schedule:
    # Ogni 2h durante l'orario di mercato US (13-21 UTC ~ pre-market/close
    # incluso), lun-ven. Con orizzonte di scalping 1-2gg, un check
    # settimanale arriva troppo tardi rispetto al filing reale.
    - cron: '0 13,15,17,19,21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/the_machine.db
          key: the-machine-db-${{ github.run_id }}
          restore-keys: the-machine-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EDGAR_USER_AGENT:   ${{ secrets.EDGAR_USER_AGENT }}
        run: python run_once.py --mode signals
